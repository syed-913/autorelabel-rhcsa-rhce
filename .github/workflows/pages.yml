name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'banks/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'docs/guide/**'
      - 'docs/ARCHITECTURE.md'
      - 'docs/media/**'
      - 'docs/social-preview.png'
      - '.github/workflows/pages.yml'
  # Pull requests (such as Dependabot's) only build and check; they never deploy.
  pull_request:
    paths:
      - 'site/**'
      - 'banks/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'docs/guide/**'
      - 'docs/ARCHITECTURE.md'
      - 'docs/media/**'
      - 'docs/social-preview.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one to finish.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # The dependency audit (npm run check:deps) is left out on purpose: a new
      # advisory in a build tool shouldn't block a docs fix. Dependabot alerts cover it.
      - run: npm run check && npm run build && npm run verify && npm run check:html
        working-directory: site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
