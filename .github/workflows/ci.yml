name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (hash-locked)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install pytest ruff

      - name: Lint Python
        run: ruff check src tests

      - name: Lint shell scripts
        run: |
          shellcheck autorelabel scripts/*.sh packer/scripts/*.sh vagrant/provision/*.sh
          find banks -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning

      - name: Unit tests (includes the 10,000-seed blueprint simulation)
        run: python -m pytest -q
        env:
          PYTHONPATH: src

      - name: Task bank lint and coverage gate
        run: python -m autorelabel bank lint rhcsa rhce
        env:
          PYTHONPATH: src

      - name: RHCE playbooks pass a syntax check (ansible-core 2.16, as in the lab)
        run: |
          python -m venv /tmp/ansible216
          /tmp/ansible216/bin/pip install "ansible-core==2.16.14"
          /tmp/ansible216/bin/ansible-galaxy collection install -p /tmp/collections \
            ansible.posix:==2.2.2 community.general:==11.4.9
          PATH=/tmp/ansible216/bin:$PATH python scripts/dev/check-rhce-playbooks.py --collections /tmp/collections
        env:
          PYTHONPATH: src

      - name: Coverage reports and the objective lists in the user guide are up to date
        run: |
          python -m autorelabel bank coverage rhcsa --check
          python -m autorelabel bank coverage rhce --check
        env:
          PYTHONPATH: src
