# RHCE exam composition.
tasks: 20
duration_minutes: 240
total_points: 300
pass_mark: 210

points: {easy: 10, medium: 15, hard: 20}
difficulty_mix: {easy: 6, medium: 8, hard: 6}
# An exam has this mix or one of these; each is 20 tasks and 300 points.
alternative_mixes:
  - {easy: 5, medium: 10, hard: 5}
  - {easy: 4, medium: 12, hard: 4}

domains:
  rhcsa: [0, 2]
  core: [1, 5]
  configure: [1, 2]
  nodes: [1, 2]
  run: [1, 2]
  git: [1, 2]
  vscode: [1, 2]
  playbooks: [1, 4]
  roles: [1, 3]
  automate: [3, 6]
  content: [1, 3]

require:
  - [rhce.content.vault]
  - [rhce.content.templates]
  - [rhce.roles.]

# Every RHCE exam starts with these (as the real one does): configure Ansible, prepare the
# managed nodes, install the content collections, configure the repositories with Ansible.
anchors: [ansible-setup, managed-access, collections, repos]

# Practice sessions that don't include them get these solved automatically, so any single
# task can be drilled on its own. (Repositories are handled like RHCSA: lab.repo is provided.)
practice_prereqs: [ansible-setup, managed-access, collections]

coverage_gate: full
