title: Add a Flatpak remote by URL and key
primary: rhcsa.software.flatpak-repos
objectives: [rhcsa.software.flatpak-repos]
facets:
  - rhcsa.software.flatpak-repos:flatpak-remote-url
  - rhcsa.software.flatpak-repos:flatpak-remote-scope
difficulty: medium
difficulty_reason: >
  Adding a remote from its repository URL requires providing the GPG key yourself; the remote must
  be per-user for a specific account, not system-wide.
estimated_minutes: 6
node: node2
exclusive: [flatpak-node2]
params:
  user: {pool: usernames}
  remote: {choice: [labapps, team-flatpaks, utility-apps]}

prompt: |
  On node2, the user `{{user}}` wants their **own** (per-user) Flatpak remote called `{{remote}}`
  pointing to the repository URL `{{lab.flatpak_repo}}`. The repository is signed with the key
  published at `http://{{lab.utility_fqdn}}/flatpak/lab.gpg`; signature verification must stay
  enabled.

  Do not add the remote system-wide. Flatpak may need to be installed first.

requirements:
  R1: "{{user}} has a per-user remote {{remote}} with the repository URL"
  R2: "the remote verifies signatures with the lab key"
  R3: "no system-wide remote named {{remote}}"

checks:
  - id: user-remote
    covers: [R1]
    on: node2
    desc: "{{user}}'s remote {{remote}} → {{lab.flatpak_repo}}"
    run: |
      sudo -u {{user}} -H flatpak remotes --user --columns=name,url 2>/dev/null | awk '{print $1, $2}' \
        | grep -E '^{{remote}} ' | grep -q 'utility.lab.example.com/flatpak/repo'
  - id: gpg
    covers: [R2]
    on: node2
    desc: signature verification enabled with a stored key
    run: |
      cfg=/home/{{user}}/.local/share/flatpak/repo/config
      grep -A8 '^\[remote "{{remote}}"\]' "$cfg" | grep -q 'gpg-verify=true'
      test -s "/home/{{user}}/.local/share/flatpak/repo/{{remote}}.trustedkeys.gpg"
  - id: not-system
    covers: [R3]
    on: node2
    desc: "no system remote called {{remote}}"
    run: "! flatpak remotes --system --columns=name 2>/dev/null | grep -qx '{{remote}}'"

references:
  - "RHEL 10: Installing and managing applications with Flatpak (remotes)"
  - "man flatpak-remote-add(1) (--user, --gpg-import)"
