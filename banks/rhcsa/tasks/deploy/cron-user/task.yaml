title: Schedule a recurring job for a user
primary: rhcsa.deploy.scheduling
objectives: [rhcsa.deploy.scheduling]
facets: [rhcsa.deploy.scheduling:cron-user]
difficulty: easy
difficulty_reason: One crontab entry; the only pitfalls are field order and doing it for the right user.
estimated_minutes: 4
node: node1
params:
  user: {pool: usernames}
  minute: {choice: ["05", "12", "23", "34", "47"]}
  hour: {choice: ["08", "13", "17", "21"]}
  dow: {choice: ["1-5", "1,3,5", "6,0"]}
  word: {pool: words}

prompt: |
  On node1, user `{{user}}` must run the following command at **{{hour}}:{{minute}}** (24-hour
  clock) on days-of-week **{{dow}}** (cron numbering, 0 = Sunday), as a cron job owned by
  `{{user}}`:

      logger -t {{word}} "scheduled job ran"

requirements:
  R1: "{{user}}'s crontab runs the command at {{minute}} {{hour}} on days {{dow}}"

checks:
  - id: crontab
    covers: [R1]
    desc: "{{user}}'s crontab has the job at {{minute}} {{hour}} * * {{dow}}"
    run: |
      crontab -l -u {{user}} 2>/dev/null | python3 -c '
      import sys, re
      want_cmd = "logger -t {{word}}"
      def norm(f):
          return f.lstrip("0") or "0"
      for line in sys.stdin:
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          parts = line.split(None, 5)
          if len(parts) < 6 or want_cmd not in parts[5]:
              continue
          m, h, dom, mon, dow = parts[:5]
          days = set()
          for item in dow.replace("Sun","0").replace("sun","0").split(","):
              if "-" in item:
                  a, b = item.split("-"); days.update(range(int(a), int(b) + 1))
              elif item != "*":
                  days.add(int(item) % 7)
          want = set()
          for item in "{{dow}}".split(","):
              if "-" in item:
                  a, b = item.split("-"); want.update(range(int(a), int(b) + 1))
              else:
                  want.add(int(item) % 7)
          days = {d % 7 for d in days}
          if norm(m) == norm("{{minute}}") and norm(h) == norm("{{hour}}") and dom == "*" and mon == "*" and days == want:
              sys.exit(0)
      sys.exit(1)'

references:
  - "RHEL 10: Configuring basic system settings > Scheduling recurring jobs with cron (crontab format)"
  - "man crontab(1), man crontab(5)"
