title: Create a bzip2-compressed archive
primary: rhcsa.tools.archive
objectives: [rhcsa.tools.archive]
facets: [rhcsa.tools.archive:tar-bzip2]
difficulty: easy
difficulty_reason: One tar command with the right compression flag.
estimated_minutes: 3
node: node1
params:
  dir: {choice: [/etc/ssh, /etc/sysconfig, /etc/security, /etc/pam.d]}
  name: {pool: words}

prompt: |
  On node1, create a **bzip2**-compressed tar archive `/root/{{name}}-backup.tar.bz2` that contains
  the directory `{{dir}}` and everything in it.

requirements:
  R1: "the archive is a bzip2-compressed tar file"
  R2: "it contains {{dir}} and its contents"

checks:
  - id: type
    covers: [R1]
    desc: the file is bzip2-compressed tar
    run: |
      file -b /root/{{name}}-backup.tar.bz2 | grep -qi bzip2
      tar -tjf /root/{{name}}-backup.tar.bz2 >/dev/null
  - id: content
    covers: [R2]
    desc: "all of {{dir}} is inside"
    run: |
      # Against the directory as it was when the exam started (recorded by the setup), not as
      # it is now: later work may add files to it (a drop-in, a backup copy of a file). Every
      # entry but directories counts, symlinks too (/etc/pam.d and /etc/sysconfig have some).
      then="/etc/autorelabel/{{name}}-backup.files"
      test -s "$then"
      got="$(tar -tjf /root/{{name}}-backup.tar.bz2 | sed 's|^\./||; s|^/||' | grep -v '/$' | LC_ALL=C sort)"
      still="$(cd / && while read -r f; do if [ -e "$f" ] || [ -L "$f" ]; then echo "$f"; fi; done < "$then")"
      test -n "$still"
      missing="$(LC_ALL=C comm -23 <(echo "$still") <(echo "$got"))"
      test -z "$missing" || { echo "not in the archive: $(sed -n 1p <<<"$missing")"; exit 1; }
      # and nothing from outside the directory
      dir="{{dir}}"
      test -z "$(grep -v "^${dir#/}/" <<<"$got" || true)"

references:
  - "man tar(1) (-j, --bzip2), man bzip2(1)"
