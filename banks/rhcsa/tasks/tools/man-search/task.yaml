title: Search the manual pages
primary: rhcsa.tools.docs
objectives: [rhcsa.tools.docs]
facets: [rhcsa.tools.docs:man-page]
difficulty: easy
difficulty_reason: Uses man -k (which needs the man index) and a man page section; no configuration.
estimated_minutes: 4
node: node1
params:
  keyword: {choice: [partition, journal, firewall, password]}

prompt: |
  On node1:
  1. Save the list of manual pages whose name or short description matches the keyword
     `{{keyword}}` (the output of a keyword search of the manual) into `/root/man-{{keyword}}.txt`.
     If the search finds nothing, the manual page index may need to be built first.
  2. The manual page `passwd(5)` describes a file format. Write the **section number** that
     documents file formats into `/root/man-section.txt` (just the number).

requirements:
  R1: "/root/man-{{keyword}}.txt holds the keyword search results"
  R2: "/root/man-section.txt holds the file-format section number"

checks:
  - id: search
    covers: [R1]
    desc: "the file holds what man -k {{keyword}} finds"
    run: |
      # Against the search result recorded by the setup, not only today's: software installed
      # later in the exam adds manual pages, and the answer was right when it was saved.
      then="/etc/autorelabel/man-{{keyword}}.expected"
      test -s "$then"
      got="$(LC_ALL=C sort /root/man-{{keyword}}.txt)"
      now="$(man -k {{keyword}} 2>/dev/null || true)"
      # nothing missing: every page the system had from the start
      missing="$(LC_ALL=C comm -13 <(echo "$got") "$then")"
      test -z "$missing" || { echo "missing: $(sed -n 1p <<<"$missing")"; exit 1; }
      # nothing else: any further line is a page the search finds today
      extra="$(LC_ALL=C comm -23 <(echo "$got") <(LC_ALL=C sort -u "$then" <(echo "$now")))"
      test -z "$extra" || { echo "not a search result: $(sed -n 1p <<<"$extra")"; exit 1; }
  - id: section
    covers: [R2]
    desc: the section number is 5
    run: test "$(tr -d '[:space:]' < /root/man-section.txt)" = 5

references:
  - "man man(1) (sections, -k), man apropos(1), man mandb(8)"
